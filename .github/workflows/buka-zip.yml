name: Buka paket ZIP
on:
  push:
    paths:
      - 'paket-website.zip'
      - '.github/workflows/buka-zip.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  buka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buka paket-website.zip
        run: |
          if [ ! -f paket-website.zip ]; then echo "Tidak ada paket-website.zip, selesai."; exit 0; fi
          rm -rf /tmp/paket && mkdir /tmp/paket
          unzip -q -o paket-website.zip -d /tmp/paket
          src=/tmp/paket
          if [ -d /tmp/paket/ishma-gorden ]; then src=/tmp/paket/ishma-gorden; fi
          rm -rf "$src/.github"
          cp -a "$src"/. .
          rm -f paket-website.zip
      - name: Simpan hasilnya ke repository
        run: |
          git config user.name "ishma-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Buka paket website" || echo "Tidak ada perubahan"
          git push
